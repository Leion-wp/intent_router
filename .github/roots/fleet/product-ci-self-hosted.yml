# Install as .github/workflows/factory-ci.yml on a managed private product.
name: factory-ci

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: factory-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: [self-hosted, linux, x64, roots-private-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- --run
      - run: pnpm build

name: factory-fleet-completion-reconciler-v2

"on":
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: factory-fleet-completion-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLEET_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
      CONTROL_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Close completed issues and advance the fleet
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLEET_TOKEN"
          echo "::add-mask::$FLEET_TOKEN"
          export GH_TOKEN="$FLEET_TOKEN"
          test "$(gh api user --jq '.login')" = "$OWNER"
          identity_helper="$GITHUB_WORKSPACE/.github/roots/factory_worker_identity.py"
          test -f "$identity_helper"

          gh api --paginate 'user/repos?per_page=100&affiliation=owner' \
            | jq -r --arg owner "$OWNER" '.[] | select(.owner.login == $owner) | .full_name' > repos.txt

          completed=0
          while IFS= read -r repo; do
            [ "$repo" = "$GITHUB_REPOSITORY" ] && continue
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${repo}/contents/.factory/profile.json" > /tmp/profile.json 2>/dev/null || continue
            jq -e --arg repo "$repo" \
              '.managed == true and .repository == $repo and .blueprint == "roots-micro-saas-v1"' \
              /tmp/profile.json >/dev/null || continue
            branch="$(jq -r '.default_branch' /tmp/profile.json)"

            gh issue list --repo "$repo" --state open --limit 100 --json number,labels > /tmp/open-issues.json
            gh issue list --repo "$repo" --state closed --label 'factory:dispatched' \
              --limit 100 --json number,labels,stateReason \
              | jq '[.[] | select(.stateReason == "COMPLETED")]' > /tmp/closed-issues.json
            jq -s 'add | unique_by(.number)' /tmp/open-issues.json /tmp/closed-issues.json \
              | jq -r -f .github/roots/fleet/reconcile-candidates.jq > /tmp/candidates.txt

            while IFS= read -r issue; do
              [ -z "$issue" ] && continue

              # PR-body issue references are untrusted discovery context. Completion authority
              # must come from the same worker↔PR correlation primitive used by other gates.
              gh api --paginate "repos/${repo}/issues/${issue}/comments" --jq '.[]' \
                | jq -s '.' > /tmp/completion-comments.json
              gh pr list --repo "$repo" --state merged --limit 100 \
                --json number,body,headRefName,baseRefName,url,mergedAt,isDraft \
                > /tmp/merged-prs.json

              set +e
              python "$identity_helper" select \
                --repo "$repo" \
                --issue "$issue" \
                --comments-json /tmp/completion-comments.json \
                --prs-json /tmp/merged-prs.json \
                --base "$branch" \
                > /tmp/completion-identity.json 2>/tmp/completion-identity.err
              identity_rc=$?
              set -e
              if [ "$identity_rc" -eq 2 ]; then
                # The canonical worker PR has not merged. An unrelated merged PR that merely
                # references this issue cannot release the worker identity.
                continue
              fi
              if [ "$identity_rc" -ne 0 ]; then
                echo "CONTROL_PLANE_ANOMALY: canonical completion correlation failed for ${repo}#${issue}: $(cat /tmp/completion-identity.err)" >&2
                continue
              fi

              pr="$(jq -r '.pr' /tmp/completion-identity.json)"
              worker_provider="$(jq -r '.provider' /tmp/completion-identity.json)"
              jq --argjson pr "$pr" '[.[] | select(.number == $pr)]' /tmp/merged-prs.json > /tmp/canonical-merged.json
              count="$(jq 'length' /tmp/canonical-merged.json)"
              if [ "$count" -ne 1 ]; then
                echo "CONTROL_PLANE_ANOMALY: canonical PR #${pr} for ${repo}#${issue} is not uniquely present in merged PR state." >&2
                continue
              fi

              pr_url="$(jq -r '.[0].url' /tmp/canonical-merged.json)"
              merged_at="$(jq -r '.[0].mergedAt // "unknown"' /tmp/canonical-merged.json)"
              done_marker="<!-- roots-fleet-task-done issue=${issue} pr=${pr} -->"
              gh label create 'factory:done' --repo "$repo" --color 0E8A16 \
                --description 'Factory task completed by merged pull request' --force >/dev/null
              gh api --method PATCH "repos/${repo}/issues/${issue}" \
                -f state=closed -f state_reason=completed >/dev/null
              if ! jq -e --arg marker "$done_marker" '.[] | select((.body // "") | contains($marker))' /tmp/completion-comments.json >/dev/null; then
                gh api --method POST "repos/${repo}/issues/${issue}/comments" \
                  -f body="${done_marker}\nRoots Fleet reconciled canonical merged PR #${pr} from worker=${worker_provider} as task completion. PR: ${pr_url}. Merged: ${merged_at}." >/dev/null
              fi
              gh issue edit "$issue" --repo "$repo" --add-label 'factory:done' --remove-label 'factory:dispatched' >/dev/null
              completed="$((completed + 1))"
              echo "TASK_DONE: ${repo}#${issue} via canonical PR #${pr} worker=${worker_provider}."
            done < /tmp/candidates.txt
          done < repos.txt

          echo "completed=$completed" >> "$GITHUB_OUTPUT"
          echo "Reconciled completed tasks: $completed"

      - name: Reconcile deterministic planning and let it own queue dispatch
        shell: bash
        run: |
          set -euo pipefail
          GH_TOKEN="$CONTROL_TOKEN" gh workflow run factory-autonomous-planning.yml \
            --repo "$GITHUB_REPOSITORY" --ref Android -f execute=true
          echo 'COMPLETION_HANDOFF: planning dispatched; planner owns materialization then dispatch_only.'

      - name: Summary
        shell: bash
        env:
          COMPLETED: ${{ steps.reconcile.outputs.completed }}
        run: |
          {
            echo '### Fleet completion reconciler v2'
            echo "- Completed issues reconciled: ${COMPLETED:-0}"
            echo '- Candidates: dispatched tasks plus unlabeled recovery tasks; explicit blocked/human/stalled/escalated/done states are excluded.'
            echo '- Persisted worker identity may be Jules or ChatGPT; conflicting identities fail closed.'
            echo '- Rule: canonical worker-owned merged PR -> close issue -> deterministic planner.'
            echo '- PR-body issue references are discovery/context only and cannot complete a task without canonical worker correlation.'
            echo '- Completion releases only the completed identity and never interferes with other active workers.'
          } >> "$GITHUB_STEP_SUMMARY"

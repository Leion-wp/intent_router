name: factory-jules-resume-v1

"on":
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Open issue whose existing Jules session must be resumed'
        required: true
        type: number
      message:
        description: 'Human-authored follow-up instruction for the existing Jules session'
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: jules-resume-${{ github.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  resume-jules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      FOLLOWUP_MESSAGE: ${{ inputs.message }}

    steps:
      - name: Checkout control-plane
        uses: actions/checkout@v4
        with:
          ref: Android

      - name: Validate human resume request
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JULES_API_KEY"
          echo "::add-mask::$JULES_API_KEY"
          test -n "$FOLLOWUP_MESSAGE"
          test "$(jq -r '.workers[] | select(.worker_id == "jules") | .status' .github/roots/worker-registry.json)" = "ENABLED"

          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > issue.json
          test "$(jq -r '.state' issue.json)" = "open"
          test "$(jq -r '.pull_request // empty' issue.json)" = ""

      - name: Resolve exactly one active linked PR
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "#${ISSUE_NUMBER}" \
            --json number,body,url,baseRefName,headRepository > open-prs.json

          jq --argjson issue "$ISSUE_NUMBER" '
            [.[]
              | select((.body // "") | test("(?i)(fixes|closes|resolves|refs|references)\\s+#" + ($issue|tostring) + "\\b"))
              | select(.baseRefName == "Android")]
          ' open-prs.json > linked-prs.json

          count="$(jq 'length' linked-prs.json)"
          if [ "$count" -ne 1 ]; then
            echo "Resume requires exactly one active Android PR linked to issue #${ISSUE_NUMBER}; found ${count}." >&2
            if [ -s open-prs.json ]; then
              echo 'Open PR candidates returned by GitHub search:' >&2
              jq -r '.[] | "- PR #\(.number): \(.url) | base=\(.baseRefName) | body=\((.body // "") | gsub("\\n"; " ") | .[0:160])"' open-prs.json >&2
            fi
            exit 1
          fi

          pr_number="$(jq -r '.[0].number' linked-prs.json)"
          pr_url="$(jq -r '.[0].url' linked-prs.json)"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > pr.json
          test "$(jq -r '.base.ref' pr.json)" = 'Android'
          test "$(jq -r '.head.repo.full_name' pr.json)" = "$GITHUB_REPOSITORY"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Resolve existing Jules session
        id: session
        shell: bash
        run: |
          set -euo pipefail
          task_id="${GITHUB_REPOSITORY}#${ISSUE_NUMBER}"

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            | jq 'add' > comments.json

          set +e
          python - "$GITHUB_REPOSITORY" "$ISSUE_NUMBER" <<'PY' > worker-identity.json
          import json
          import sys
          sys.path.insert(0, '.github/roots')
          from factory_worker_identity import IdentityConflict, IdentityNoMatch, issue_identity

          repo = sys.argv[1]
          issue = int(sys.argv[2])
          with open('comments.json', encoding='utf-8') as handle:
              comments = json.load(handle)
          try:
              identity = issue_identity(repo, issue, comments)
          except IdentityNoMatch as exc:
              print(f'IDENTITY_NO_MATCH: {exc}', file=sys.stderr)
              raise SystemExit(2)
          except IdentityConflict as exc:
              print(f'IDENTITY_CONFLICT: {exc}', file=sys.stderr)
              raise SystemExit(3)
          print(json.dumps(identity, sort_keys=True))
          PY
          identity_rc=$?
          set -e

          if [ "$identity_rc" -eq 0 ]; then
            test "$(jq -r '.provider' worker-identity.json)" = 'jules'
            session="$(jq -r '.session' worker-identity.json)"
            python .github/roots/factory_worker_identity.py validate \
              --repo "$GITHUB_REPOSITORY" \
              --issue "$ISSUE_NUMBER" \
              --comments-json comments.json \
              --pr-json pr.json \
              --base Android > pr-identity.json
            test "$(jq -r '.provider' pr-identity.json)" = 'jules'
            test "$(jq -r '.session' pr-identity.json)" = "$session"
            resolution="durable_mapping"
          elif [ "$identity_rc" -eq 2 ]; then
            curl --fail-with-body --silent --show-error \
              -H "X-Goog-Api-Key: $JULES_API_KEY" \
              'https://jules.googleapis.com/v1alpha/sessions?pageSize=100' > sessions.json

            jq -r --arg task "$task_id" '
              [.sessions[]? | select(.title == $task) | .name] | unique[]
            ' sessions.json > discovered-sessions.txt

            discovered_count="$(wc -l < discovered-sessions.txt | tr -d ' ')"
            if [ "$discovered_count" -ne 1 ]; then
              echo "Expected exactly one Jules session titled ${task_id}; found ${discovered_count}." >&2
              exit 1
            fi

            session="$(cat discovered-sessions.txt)"
            token="${session##*/}"
            head_ref="$(jq -r '.head.ref' pr.json)"
            case "$head_ref" in
              *"$token"*) ;;
              *)
                echo "Discovered Jules session ${session} does not match active PR branch ${head_ref}." >&2
                exit 1
                ;;
            esac
            resolution="api_discovery"
          else
            exit "$identity_rc"
          fi

          curl --fail-with-body --silent --show-error \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            "https://jules.googleapis.com/v1alpha/${session}" > session.json

          test "$(jq -r '.title' session.json)" = "$task_id"
          echo "session=$session" >> "$GITHUB_OUTPUT"
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"
          echo "resolution=$resolution" >> "$GITHUB_OUTPUT"

      - name: Backfill durable mapping when discovered from Jules API
        if: steps.session.outputs.resolution == 'api_discovery'
        shell: bash
        env:
          SESSION: ${{ steps.session.outputs.session }}
          TASK_ID: ${{ steps.session.outputs.task_id }}
        run: |
          set -euo pipefail
          marker="<!-- roots-jules-session task_id=${TASK_ID} session=${SESSION} -->"
          body="${marker}\nRoots control-plane worker session\n\n- Worker: Jules\n- Task: ${TASK_ID}\n- Session: ${SESSION}\n- Mapping source: authenticated Jules Sessions API discovery\n- Rework policy: all follow-up must reuse this same session."
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="$body" >/dev/null

      - name: Revalidate canonical worker identity before follow-up
        shell: bash
        env:
          SESSION: ${{ steps.session.outputs.session }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            | jq 'add' > comments-final.json
          python .github/roots/factory_worker_identity.py validate \
            --repo "$GITHUB_REPOSITORY" \
            --issue "$ISSUE_NUMBER" \
            --comments-json comments-final.json \
            --pr-json pr.json \
            --base Android > final-identity.json
          test "$(jq -r '.provider' final-identity.json)" = 'jules'
          test "$(jq -r '.session' final-identity.json)" = "$SESSION"

      - name: Send follow-up to the same Jules session
        shell: bash
        env:
          SESSION: ${{ steps.session.outputs.session }}
          TASK_ID: ${{ steps.session.outputs.task_id }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          prompt="$(printf '%s\n' \
            'CONTROL-PLANE FOLLOW-UP (authoritative)' \
            "Task: ${TASK_ID}" \
            "Existing PR: #${PR_NUMBER}" \
            "Existing Jules session: ${SESSION}" \
            'Continue this same task, same Jules session, same branch and same PR. Do not create another session or PR.' \
            'Target remains Android /acode-plugin only. Existing control-plane forbidden actions remain authoritative.' \
            '' \
            'Human follow-up instruction:' \
            "$FOLLOWUP_MESSAGE")"

          jq -n --arg prompt "$prompt" '{prompt:$prompt}' > resume-message.json
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            --data @resume-message.json \
            "https://jules.googleapis.com/v1alpha/${SESSION}:sendMessage"

          {
            echo '### Jules same-session resume'
            echo "- Task: ${TASK_ID}"
            echo "- Issue: #${ISSUE_NUMBER}"
            echo "- PR: #${PR_NUMBER}"
            echo "- Session: ${SESSION}"
            echo "- Resolution: ${{ steps.session.outputs.resolution }}"
            echo '- Action: follow-up delivered through sendMessage to the existing Jules session'
          } >> "$GITHUB_STEP_SUMMARY"

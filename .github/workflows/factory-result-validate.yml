name: factory-result-validate-v1

on:
  workflow_call:
    inputs:
      result_json:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      result_json:
        description: 'FactoryResult JSON to validate'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Parse FactoryResult
        env:
          RESULT_JSON: ${{ inputs.result_json }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e . > factory-result.json

      - name: Validate strict core envelope
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .version == 1 and
            (.task_id | type == "string" and test("^[^#]+/[^#]+#[1-9][0-9]*$")) and
            (.status | IN("SUCCEEDED", "REWORK", "BLOCKED", "FAILED")) and
            (.worker | type == "string" and length > 0) and
            (.summary | type == "string" and length > 0) and
            (.outputs | type == "object") and
            (.evidence | type == "object") and
            (.evidence.tests | type == "array") and
            (.risks | type == "array") and
            (.next_action | IN("REVIEW", "REWORK", "WAIT", "CLOSE", "NONE")) and
            ((keys - ["version","task_id","status","worker","summary","outputs","evidence","risks","next_action","extensions"]) | length == 0)
          ' factory-result.json >/dev/null

      - name: Upload validated result
        uses: actions/upload-artifact@v4
        with:
          name: validated-factory-result
          path: factory-result.json
          retention-days: 7

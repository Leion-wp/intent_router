name: factory-result-validate-v1

on:
  workflow_call:
    inputs:
      result_json:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      result_json:
        description: 'FactoryResult JSON to validate'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical FactoryResult contract
        uses: actions/checkout@v4
        with:
          repository: Leion-wp/intent_router
          ref: Android
          sparse-checkout: |
            .github/roots/factory-result.schema.json
            .github/roots/factory_result_validate.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.23.0'

      - name: Parse FactoryResult
        env:
          RESULT_JSON: ${{ inputs.result_json }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e . > factory-result.json

      - name: Validate canonical FactoryResult schema
        run: >-
          python .github/roots/factory_result_validate.py
          --schema .github/roots/factory-result.schema.json
          --result factory-result.json

      - name: Validate status transition semantics
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            if .status == "REWORK" then .next_action == "REWORK"
            elif .status == "FAILED" then (.next_action | IN("CLOSE", "HUMAN_REQUIRED", "NONE"))
            elif .status == "BLOCKED" then (.next_action | IN("WAIT", "HUMAN_REQUIRED", "CLOSE"))
            elif .status == "SUCCEEDED" then (.next_action | IN("REVIEW", "WAIT", "NONE"))
            else false end
          ' factory-result.json >/dev/null

      - name: Reject secret-shaped outputs
        shell: bash
        run: |
          set -euo pipefail
          if jq -r '.. | strings' factory-result.json | grep -Eiq '(sk-[A-Za-z0-9_-]{12,}|AIza[0-9A-Za-z_-]{20,}|gh[pousr]_[A-Za-z0-9_]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)'; then
            echo 'FactoryResult contains a value that looks like a secret or private key.' >&2
            exit 1
          fi

      - name: Upload validated result
        uses: actions/upload-artifact@v4
        with:
          name: validated-factory-result
          path: factory-result.json
          retention-days: 7

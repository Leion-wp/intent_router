name: factory-result-validate-v1

on:
  workflow_call:
    inputs:
      result_json:
        required: true
        type: string
      expected_task_id:
        required: false
        type: string
        default: ''
      expected_worker:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      result_json:
        description: 'FactoryResult JSON to validate'
        required: true
        type: string
      expected_task_id:
        description: 'Optional exact FactoryTask identity'
        required: false
        type: string
        default: ''
      expected_worker:
        description: 'Optional exact worker identity'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable FactoryResult contract revision
        uses: actions/checkout@v4
        with:
          repository: Leion-wp/intent_router
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/roots/factory-result.schema.json
            .github/roots/factory_result_validate.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.23.0'

      - name: Parse FactoryResult
        env:
          RESULT_JSON: ${{ inputs.result_json }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$RESULT_JSON" | jq -e . > factory-result.json

      - name: Validate canonical FactoryResult boundary
        env:
          EXPECTED_TASK_ID: ${{ inputs.expected_task_id }}
          EXPECTED_WORKER: ${{ inputs.expected_worker }}
        shell: bash
        run: |
          set -euo pipefail
          set -- python .github/roots/factory_result_validate.py \
            --schema .github/roots/factory-result.schema.json \
            --result factory-result.json
          if [ -n "$EXPECTED_TASK_ID" ]; then
            set -- "$@" --expected-task-id "$EXPECTED_TASK_ID"
          fi
          if [ -n "$EXPECTED_WORKER" ]; then
            set -- "$@" --expected-worker "$EXPECTED_WORKER"
          fi
          "$@"

      - name: Upload validated result
        uses: actions/upload-artifact@v4
        with:
          name: validated-factory-result
          path: factory-result.json
          retention-days: 7

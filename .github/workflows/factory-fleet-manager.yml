name: factory-fleet-manager-v1

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Account-level operation'
        required: true
        type: choice
        options: [inventory, ensure-project, ensure-repository, ensure-milestone]
      target:
        description: 'Project title, repository name, or owner/repo for milestone operation'
        required: true
        default: 'Roots Factory'
        type: string
      milestone_title:
        description: 'Milestone title for ensure-milestone'
        required: false
        default: MVP
        type: string
      apply:
        description: 'Human mutation gate. false is read-only/dry-run.'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: factory-fleet-manager-${{ github.repository_owner }}
  cancel-in-progress: false

jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      OPERATION: ${{ inputs.operation }}
      TARGET: ${{ inputs.target }}
      MILESTONE_TITLE: ${{ inputs.milestone_title }}
      APPLY: ${{ inputs.apply }}
    steps:
      - uses: actions/checkout@v4

      - name: Enforce human-owned fleet boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/roots/factory-fleet.schema.json
          if [ -z "$GH_TOKEN" ]; then
            echo 'FLEET_GITHUB_TOKEN is required for account-level fleet operations.' >&2
            exit 1
          fi
          echo "::add-mask::$GH_TOKEN"
          test "$OWNER" = "Leion-wp"
          authenticated_login="$(gh api user --jq '.login')"
          test "$authenticated_login" = "$OWNER"

      - name: Inventory account
        if: inputs.operation == 'inventory'
        shell: bash
        run: |
          set -euo pipefail
          project_query="query(\$login:String!){user(login:\$login){projectsV2(first:100){nodes{number title closed}}}}"
          gh api --paginate 'user/repos?per_page=100&affiliation=owner' --jq --arg owner "$OWNER" '.[] | select(.owner.login == $owner) | [.name,.visibility,.default_branch,.archived] | @tsv' > repositories.tsv
          gh api graphql -f query="$project_query" -F login="$OWNER" --jq '.data.user.projectsV2.nodes[] | [.number,.title,.closed] | @tsv' > projects.tsv
          {
            echo '### Fleet inventory'
            echo "- Owner: ${OWNER}"
            echo "- Repositories: $(wc -l < repositories.tsv | tr -d ' ')"
            echo "- Projects v2: $(wc -l < projects.tsv | tr -d ' ')"
            echo ''
            echo '#### Repositories'
            sed 's/^/- /' repositories.tsv
            echo ''
            echo '#### Projects'
            sed 's/^/- /' projects.tsv
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure account project
        if: inputs.operation == 'ensure-project'
        shell: bash
        run: |
          set -euo pipefail
          owner_query="query(\$login:String!){user(login:\$login){id projectsV2(first:100){nodes{id number title}}}}"
          create_mutation="mutation(\$owner:ID!,\$title:String!){createProjectV2(input:{ownerId:\$owner,title:\$title}){projectV2{id number title}}}"
          gh api graphql -f query="$owner_query" -F login="$OWNER" > owner.json
          owner_id="$(jq -r '.data.user.id' owner.json)"
          test -n "$owner_id"
          test "$owner_id" != 'null'
          jq --arg title "$TARGET" '[.data.user.projectsV2.nodes[] | select(.title == $title)]' owner.json > matches.json
          count="$(jq 'length' matches.json)"
          if [ "$count" -gt 1 ]; then
            echo "CONTROL_PLANE_ANOMALY: duplicate account projects named '${TARGET}'." >&2
            exit 1
          fi
          if [ "$count" -eq 0 ] && [ "$APPLY" = "true" ]; then
            gh api graphql -f query="$create_mutation" -F owner="$owner_id" -F title="$TARGET" > created.json
            jq '.data.createProjectV2.projectV2' created.json
          else
            echo "project_count=${count} apply=${APPLY}"
            cat matches.json
          fi

      - name: Ensure repository
        if: inputs.operation == 'ensure-repository'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET" =~ ^[A-Za-z0-9._-]+$ ]]
          if gh api "repos/${OWNER}/${TARGET}" >/dev/null 2>&1; then
            echo "Repository ${OWNER}/${TARGET} already exists."
            exit 0
          fi
          if [ "$APPLY" != "true" ]; then
            echo "DRY-RUN: would create private repository ${OWNER}/${TARGET}."
            exit 0
          fi
          gh api --method POST user/repos \
            -f name="$TARGET" \
            -F private=true \
            -f description='Managed by Roots Factory control-plane; governance remains human-owned.' \
            -F has_issues=true \
            -F has_projects=true > repo.json
          test "$(jq -r '.owner.login' repo.json)" = "$OWNER"
          jq '{full_name,html_url,visibility}' repo.json

      - name: Ensure milestone in managed repository
        if: inputs.operation == 'ensure-milestone'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET" =~ ^[^/]+/[^/]+$ ]]
          test "${TARGET%%/*}" = "$OWNER"
          gh api --paginate "repos/${TARGET}/milestones?state=all&per_page=100" > milestones.json
          jq --arg title "$MILESTONE_TITLE" '[.[] | select(.title == $title)]' milestones.json > matches.json
          count="$(jq 'length' matches.json)"
          if [ "$count" -gt 1 ]; then
            echo "CONTROL_PLANE_ANOMALY: duplicate milestone '${MILESTONE_TITLE}' in ${TARGET}." >&2
            exit 1
          fi
          if [ "$count" -eq 0 ] && [ "$APPLY" = "true" ]; then
            gh api --method POST "repos/${TARGET}/milestones" -f title="$MILESTONE_TITLE" > created.json
            jq '{number,title,state}' created.json
          else
            echo "milestone_count=${count} apply=${APPLY}"
            cat matches.json
          fi

      - name: Final summary
        shell: bash
        run: |
          {
            echo '### Fleet manager'
            echo "- Owner: ${OWNER}"
            echo "- Operation: ${OPERATION}"
            echo "- Target: ${TARGET}"
            echo "- Apply: ${APPLY}"
            echo '- Governance: repository/project creation and production authority remain human gated.'
          } >> "$GITHUB_STEP_SUMMARY"

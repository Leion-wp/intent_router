name: factory-quality-block-human-rework-v2

"on":
  workflow_dispatch:
    inputs:
      repository:
        description: 'Managed repository containing the blocked source issue (owner/name)'
        required: true
        type: string
      issue:
        description: 'Blocked source issue number'
        required: true
        type: string
      rationale:
        description: 'Human resolution explaining why same-session rework is authorized'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: factory-quality-block-human-rework-${{ inputs.repository }}-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLEET_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
      JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
      OWNER: ${{ github.repository_owner }}
      ACTOR: ${{ github.actor }}
      TARGET_REPO: ${{ inputs.repository }}
      ISSUE: ${{ inputs.issue }}
      RATIONALE: ${{ inputs.rationale }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate and persist owner-authorized Quality BLOCK delivery intent
        id: target
        shell: bash
        run: |
          set -euo pipefail
          test "$ACTOR" = "$OWNER" || { echo 'HUMAN_GATE_DENIED: only repository owner may resolve Quality BLOCK.' >&2; exit 1; }
          test -n "$FLEET_TOKEN"
          test -n "$JULES_API_KEY"
          echo "::add-mask::$FLEET_TOKEN"
          echo "::add-mask::$JULES_API_KEY"
          export GH_TOKEN="$FLEET_TOKEN"
          test "$(gh api user --jq '.login')" = "$OWNER"
          [[ "$TARGET_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$TARGET_REPO" == "$OWNER/"* ]]
          [[ "$ISSUE" =~ ^[0-9]+$ ]]
          [ -n "${RATIONALE//[[:space:]]/}" ]
          [ "${#RATIONALE}" -le 2000 ] || { echo 'HUMAN_GATE_DENIED: rationale exceeds 2000 characters.' >&2; exit 1; }
          test "$TARGET_REPO" != "$GITHUB_REPOSITORY"

          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/${TARGET_REPO}/contents/.factory/profile.json" > /tmp/profile.json
          jq -e --arg repo "$TARGET_REPO" \
            '.managed == true and .repository == $repo and .blueprint == "roots-micro-saas-v1" and (.worker_policy.enabled | index("jules") != null)' \
            /tmp/profile.json >/dev/null
          branch="$(jq -r '.default_branch' /tmp/profile.json)"

          gh api "repos/${TARGET_REPO}/issues/${ISSUE}" > /tmp/issue.json
          [ "$(jq -r '.state' /tmp/issue.json)" = open ]
          gh api --paginate "repos/${TARGET_REPO}/issues/${ISSUE}/comments" > /tmp/comments.json

          identity_helper="$GITHUB_WORKSPACE/.github/roots/factory_worker_identity.py"
          test -f "$identity_helper"
          gh pr list --repo "$TARGET_REPO" --state open --limit 100 \
            --json number,body,headRefOid,headRefName,baseRefName,isDraft,url > /tmp/prs.json

          set +e
          python "$identity_helper" select \
            --repo "$TARGET_REPO" \
            --issue "$ISSUE" \
            --comments-json /tmp/comments.json \
            --prs-json /tmp/prs.json \
            --base "$branch" \
            >/tmp/identity.json 2>/tmp/identity.err
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            cat /tmp/identity.err >&2 || true
            echo 'HUMAN_GATE_DENIED: canonical worker identity/PR resolution failed.' >&2
            exit 1
          fi
          [ "$(jq -r '.provider' /tmp/identity.json)" = jules ] || {
            echo 'HUMAN_GATE_DENIED: Quality BLOCK rework requires canonical Jules ownership.' >&2
            exit 1
          }
          session="$(jq -r '.session // empty' /tmp/identity.json)"
          pr="$(jq -r '.pr // empty' /tmp/identity.json)"
          sha="$(jq -r '.head_sha // empty' /tmp/identity.json)"
          [ -n "$session" ] && [ -n "$pr" ] && [ -n "$sha" ] || {
            echo 'HUMAN_GATE_DENIED: canonical Jules worker/PR identity is incomplete.' >&2
            exit 1
          }

          gh api "repos/${TARGET_REPO}/pulls/${pr}" > /tmp/pr.json
          [ "$(jq -r '.state' /tmp/pr.json)" = open ]
          [ "$(jq -r '.draft' /tmp/pr.json)" = false ]
          [ "$(jq -r '.base.ref' /tmp/pr.json)" = "$branch" ]
          [ "$(jq -r '.head.sha' /tmp/pr.json)" = "$sha" ]
          pr_url="$(jq -r '.html_url' /tmp/pr.json)"

          block_marker="<!-- roots-quality-verdict head=${sha} verdict=BLOCK -->"
          block_body="$(jq -r --arg marker "$block_marker" '[.[] | select((.body // "") | contains($marker))] | last | .body // empty' /tmp/comments.json)"
          [ -n "$block_body" ] || { echo 'HUMAN_GATE_DENIED: current PR head has no exact-head BLOCK verdict.' >&2; exit 1; }

          safe_repo="${TARGET_REPO//\//-}"
          token="hqr-${safe_repo}-${ISSUE}-${sha:0:16}"
          auth_marker="<!-- roots-human-quality-rework-auth head=${sha} token=${token} -->"
          delivered_marker="<!-- roots-human-quality-rework-delivered head=${sha} token=${token} -->"

          labels="$(jq '[.labels[].name]' /tmp/issue.json)"
          if jq -e --arg marker "$delivered_marker" '.[] | select((.body // "") | contains($marker))' /tmp/comments.json >/dev/null; then
            # A delivery receipt comment is only a human-readable projection. Before
            # reactivating the slot, prove the exact token through authenticated Jules
            # activity so a forged/stale comment cannot manufacture delivery authority.
            if curl --fail-with-body --silent --show-error \
              -H "X-Goog-Api-Key: $JULES_API_KEY" \
              "https://jules.googleapis.com/v1alpha/${session}/activities?pageSize=100" > /tmp/activities.json \
              && grep -Fq "$token" /tmp/activities.json; then
              echo 'send=false' >> "$GITHUB_OUTPUT"
              echo 'finalize=true' >> "$GITHUB_OUTPUT"
              echo 'HUMAN_REWORK_RECOVERY: delivery receipt corroborated by Jules activity; finalizing durable GitHub state.'
            else
              echo 'HUMAN_REWORK_UNPROVEN_RECEIPT: delivery receipt exists but authenticated Jules activity does not prove the token. Refusing state reactivation.' >&2
              exit 1
            fi
          elif jq -e --arg marker "$auth_marker" '.[] | select((.body // "") | contains($marker))' /tmp/comments.json >/dev/null; then
            # A prior run persisted delivery intent but not completion. Do not blindly resend.
            # Reconcile against Jules activity; if the token is visible, finalize GitHub state.
            if curl --fail-with-body --silent --show-error \
              -H "X-Goog-Api-Key: $JULES_API_KEY" \
              "https://jules.googleapis.com/v1alpha/${session}/activities?pageSize=100" > /tmp/activities.json \
              && grep -Fq "$token" /tmp/activities.json; then
              echo 'send=false' >> "$GITHUB_OUTPUT"
              echo 'finalize=true' >> "$GITHUB_OUTPUT"
              echo 'HUMAN_REWORK_RECOVERY: delivery token observed in Jules activity; finalizing durable GitHub state.'
            else
              echo 'HUMAN_REWORK_AMBIGUOUS: durable delivery intent exists but delivery cannot be proven. Refusing duplicate send; keep HUMAN_REQUIRED.' >&2
              exit 1
            fi
          else
            jq -e 'index("factory:human-required") != null and index("factory:escalated") != null and index("factory:blocked") != null and index("factory:dispatched") == null' \
              <<< "$labels" >/dev/null || { echo 'HUMAN_GATE_DENIED: source issue is not in canonical Quality BLOCK state.' >&2; exit 1; }

            gh api --method POST "repos/${TARGET_REPO}/issues/${ISSUE}/comments" \
              -f body="${auth_marker}\nHUMAN QUALITY REWORK AUTHORIZED: owner approved one bounded same-session delivery attempt for PR #${pr} head ${sha}. Delivery token: ${token}. Rationale: ${RATIONALE}" >/dev/null

            comments="$(gh api --paginate "repos/${TARGET_REPO}/issues/${ISSUE}/comments")"
            jq -e --arg marker "$auth_marker" '.[] | select((.body // "") | contains($marker))' <<< "$comments" >/dev/null || {
              echo 'CONTROL_PLANE_ANOMALY: human rework authorization intent did not persist; refusing remote delivery.' >&2
              exit 1
            }
            echo 'send=true' >> "$GITHUB_OUTPUT"
            echo 'finalize=true' >> "$GITHUB_OUTPUT"
          fi

          printf '%s\n' "$session" > /tmp/session.txt
          printf '%s\n' "$pr" > /tmp/pr.txt
          printf '%s\n' "$sha" > /tmp/sha.txt
          printf '%s\n' "$pr_url" > /tmp/pr-url.txt
          printf '%s\n' "$block_body" > /tmp/block.txt
          printf '%s\n' "$token" > /tmp/token.txt
          printf '%s\n' "$delivered_marker" > /tmp/delivered-marker.txt
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Deliver human-authorized rework to the same Jules session
        if: steps.target.outputs.ready == 'true' && steps.target.outputs.send == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export GH_TOKEN="$FLEET_TOKEN"
          session="$(cat /tmp/session.txt)"
          pr="$(cat /tmp/pr.txt)"
          sha="$(cat /tmp/sha.txt)"
          pr_url="$(cat /tmp/pr-url.txt)"
          block_body="$(cat /tmp/block.txt)"
          token="$(cat /tmp/token.txt)"
          delivered_marker="$(cat /tmp/delivered-marker.txt)"

          {
            printf '%s\n\n' 'CONTROL-PLANE HUMAN-AUTHORIZED QUALITY REWORK'
            printf '%s\n' "DELIVERY_TOKEN: ${token}"
            printf '%s\n' "Continue the SAME Jules session, SAME branch and SAME PR #${pr}. Never create another session, branch or PR."
            printf '%s\n' "Repository: ${TARGET_REPO}"
            printf '%s\n' "PR: ${pr_url}"
            printf '%s\n\n' "Blocked head: ${sha}"
            printf '%s\n' 'The repository owner has resolved the human gate and explicitly authorized a bounded rework of this blocked head.'
            printf '%s\n' 'Human rationale:'
            printf '%s\n\n' "$RATIONALE"
            printf '%s\n' 'Original exact-head Quality BLOCK:'
            printf '%s\n\n' "$block_body"
            printf '%s\n' 'Re-read the source issue and this human rationale together. Make only the smallest changes actually required by the clarified intent, preserve valid test/local fixtures, run relevant tests, then commit and push only to the existing PR branch. Do not modify workflows, secrets, permissions, production, provider activation or spending.'
          } > /tmp/rework-message.txt
          message="$(cat /tmp/rework-message.txt)"

          curl --fail-with-body --silent --show-error -X POST \
            -H 'Content-Type: application/json' \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            --data "$(jq -nc --arg prompt "$message" '{prompt:$prompt}')" \
            "https://jules.googleapis.com/v1alpha/${session}:sendMessage" >/dev/null

          gh api --method POST "repos/${TARGET_REPO}/issues/${ISSUE}/comments" \
            -f body="${delivered_marker}\nHUMAN QUALITY REWORK DELIVERED: same-session delivery accepted for PR #${pr} head ${sha}. Delivery token: ${token}." >/dev/null

          comments="$(gh api --paginate "repos/${TARGET_REPO}/issues/${ISSUE}/comments")"
          jq -e --arg marker "$delivered_marker" '.[] | select((.body // "") | contains($marker))' <<< "$comments" >/dev/null || {
            echo 'CONTROL_PLANE_ANOMALY: Jules accepted rework but delivery receipt did not persist; refusing to mutate issue state.' >&2
            exit 1
          }

      - name: Converge GitHub state after proven delivery
        if: steps.target.outputs.ready == 'true' && steps.target.outputs.finalize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export GH_TOKEN="$FLEET_TOKEN"
          sha="$(cat /tmp/sha.txt)"
          token="$(cat /tmp/token.txt)"
          delivered_marker="$(cat /tmp/delivered-marker.txt)"

          comments="$(gh api --paginate "repos/${TARGET_REPO}/issues/${ISSUE}/comments")"
          if ! jq -e --arg marker "$delivered_marker" '.[] | select((.body // "") | contains($marker))' <<< "$comments" >/dev/null; then
            # Recovery path: delivery was proven through Jules activity but receipt was lost.
            gh api --method POST "repos/${TARGET_REPO}/issues/${ISSUE}/comments" \
              -f body="${delivered_marker}\nHUMAN QUALITY REWORK DELIVERY RECONCILED: Jules activity proves delivery for head ${sha}. Delivery token: ${token}." >/dev/null
          fi

          comments="$(gh api --paginate "repos/${TARGET_REPO}/issues/${ISSUE}/comments")"
          jq -e --arg marker "$delivered_marker" '.[] | select((.body // "") | contains($marker))' <<< "$comments" >/dev/null || {
            echo 'CONTROL_PLANE_ANOMALY: delivery proof is not durable; refusing to reactivate worker slot.' >&2
            exit 1
          }

          gh issue edit "$ISSUE" --repo "$TARGET_REPO" \
            --remove-label 'factory:blocked' \
            --remove-label 'factory:escalated' \
            --remove-label 'factory:human-required' \
            --remove-label 'factory:stalled' \
            --add-label 'factory:dispatched' >/dev/null 2>&1 || {
              echo 'CONTROL_PLANE_ANOMALY: proven delivery exists but issue state restoration failed.' >&2
              exit 1
            }

          labels="$(gh api "repos/${TARGET_REPO}/issues/${ISSUE}" --jq '[.labels[].name]')"
          jq -e 'index("factory:dispatched") != null and index("factory:blocked") == null and index("factory:escalated") == null and index("factory:human-required") == null' \
            <<< "$labels" >/dev/null || {
              echo 'CONTROL_PLANE_ANOMALY: human rework state did not converge.' >&2
              exit 1
            }

          echo "HUMAN_REWORK_ACTIVE: ${TARGET_REPO}#${ISSUE} head ${sha} token=${token}."

      - name: Summary
        if: steps.target.outputs.ready == 'true'
        shell: bash
        run: |
          {
            echo '### Human Quality BLOCK resolution v2'
            echo "- Repository: ${TARGET_REPO}"
            echo "- Issue: #${ISSUE}"
            echo '- Authorization is persisted before remote delivery.'
            echo '- Duplicate delivery is refused unless Jules activity proves the prior attempt completed.'
            echo '- GitHub active state is restored only after durable delivery proof exists.'
            echo '- Worker identity, branch and PR are preserved; no replacement worker is created.'
          } >> "$GITHUB_STEP_SUMMARY"

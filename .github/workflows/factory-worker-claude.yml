name: factory-worker-claude-v1

on:
  workflow_call:
    inputs:
      task_json:
        required: true
        type: string
      execute:
        required: true
        type: boolean
    secrets:
      ANTHROPIC_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Validate adapter activation
        env:
          TASK_JSON: ${{ inputs.task_json }}
          EXECUTE: ${{ inputs.execute }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TASK_JSON" | jq -e . > factory-task.json
          test "$(jq -r '.target.branch' factory-task.json)" = "Android"
          test "$(jq -r '.target.cwd' factory-task.json)" = "/acode-plugin"
          test "$(jq -r '.workers[] | select(.worker_id=="claude") | .status' .github/roots/worker-registry.json)" = "ENABLED"
          test "$EXECUTE" = "true"
          test -n "$ANTHROPIC_API_KEY"

      - name: Build provider prompt
        shell: bash
        run: |
          set -euo pipefail
          jq -r '[.spec.objective, (.spec.context.issue_body // ""), "Target: Android /acode-plugin", "Forbidden actions:", (.policy.forbidden_actions[]? // empty)] | join("\n")' factory-task.json > prompt.txt

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ format('Implement this FactoryTask within the checked out repository. Read prompt.txt for the normalized task contract. Do not modify workflows, policies, secrets, production deployment, main, or anything outside /acode-plugin. Task id: {0}', fromJSON(inputs.task_json).task_id) }}
          claude_args: '--max-turns 10 --allowedTools Read,Edit,Write,Bash'

      - name: Emit worker result
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg task_id "$(jq -r '.task_id' factory-task.json)" \
            '{version:1,task_id:$task_id,status:"SUCCEEDED",worker:"claude",summary:"Claude Code action completed.",outputs:{branch:null,commit:null,pull_request:null,worker_execution_id:null,worker_url:null},evidence:{tests:[],checks:["Claude Code action completed"]},risks:["Adapter does not yet infer commit or PR identity from provider output."],next_action:"REVIEW"}' > factory-result.json

      - uses: actions/upload-artifact@v4
        with:
          name: factory-result-claude
          path: factory-result.json
          retention-days: 7

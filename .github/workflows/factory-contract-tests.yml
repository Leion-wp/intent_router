name: factory-contract-tests

"on":
  pull_request:
    branches: [Android]
    paths:
      - '.github/roots/**'
      - '.github/workflows/factory-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.23.0' 'PyYAML==6.0.3'
      - name: Validate committed schemas and fixed manifests
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import json; [json.load(open(p)) for p in [".github/roots/factory-product-state.schema.json",".github/roots/factory-product-decision.schema.json",".github/roots/factory-product-telemetry.schema.json",".github/roots/factory-credential-requirements.schema.json",".github/roots/factory-portfolio-telemetry.schema.json",".github/roots/factory-managed-merge-policy.schema.json",".github/roots/factory-managed-merge-policy.json",".github/roots/factory-release-policy.schema.json",".github/roots/factory-release-policy.json",".github/roots/factory-worker-capacity.json",".github/roots/micro-saas-credentials-v1.json"]]'
          python -c 'import json,jsonschema; d=json.load(open(".github/roots/micro-saas-credentials-v1.json")); s=json.load(open(".github/roots/factory-credential-requirements.schema.json")); jsonschema.Draft202012Validator(s).validate(d)'
          python -c 'import json,jsonschema; d=json.load(open(".github/roots/factory-managed-merge-policy.json")); s=json.load(open(".github/roots/factory-managed-merge-policy.schema.json")); jsonschema.Draft202012Validator(s).validate(d)'
          python -c 'import json,jsonschema; d=json.load(open(".github/roots/factory-release-policy.json")); s=json.load(open(".github/roots/factory-release-policy.schema.json")); jsonschema.Draft202012Validator(s).validate(d)'
          python .github/roots/validate-planning.py roadmap .github/roots/micro-saas-roadmap-v1.json
      - name: Run planning safety regression tests
        run: python .github/roots/test-planning-safety.py
      - name: Run worker capacity contract tests
        run: python .github/roots/test-worker-capacity.py
      - name: Run ChatGPT worker routing contract tests
        run: python .github/roots/test-chatgpt-worker-route.py
      - name: Run worker route bootstrap contract tests
        run: python .github/roots/test-worker-route-bootstrap.py
      - name: Run worker escalation contract tests
        run: python .github/roots/test-worker-escalation.py
      - name: Run Product Brain contract tests
        run: python .github/roots/test-product-brain.py
      - name: Run managed auto-merge LOW_RISK contract tests
        run: python .github/roots/test-managed-automerge-risk.py
      - name: Run Quality LOW_RISK handoff contract tests
        run: python .github/roots/test-quality-risk-reconciler.py
      - name: Run event-driven fleet pipeline regression tests
        shell: bash
        run: |
          set -o pipefail
          python .github/roots/test-fleet-pipeline-parallel.py 2>&1 | tee /tmp/fleet-pipeline.log
      - name: Upload fleet pipeline diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-pipeline-diagnostics
          path: |
            /tmp/fleet-pipeline.log
            .github/roots/test-fleet-pipeline.py
            .github/roots/test-fleet-pipeline-parallel.py
          include-hidden-files: true
          if-no-files-found: error
      - name: Run completion-planning ownership regression tests
        run: python .github/roots/test-completion-planning-handoff.py
      - name: Run Copilot Quality Gate contract tests
        run: python .github/roots/test-copilot-quality-gate.py
      - name: Run portfolio telemetry handoff contract tests
        run: python .github/roots/test-portfolio-telemetry-handoff.py
      - name: Run product event relay regression tests
        run: python .github/roots/test-product-event-relay.py
      - name: Run Product Brain event routing regression tests
        run: python .github/roots/test-product-brain-event-route.py

name: factory-credential-readiness-v1

"on":
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: factory-credential-readiness
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLEET_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      MANIFEST: .github/roots/micro-saas-credentials-v1.json
    steps:
      - uses: actions/checkout@v4

      - name: Maintain human-owned credential readiness gates
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLEET_TOKEN"
          echo "::add-mask::$FLEET_TOKEN"
          export GH_TOKEN="$FLEET_TOKEN"
          test "$(gh api user --jq '.login')" = "$OWNER"
          python3 -m pip install --disable-pip-version-check --quiet 'jsonschema==4.23.0'
          python3 -c 'import json,jsonschema; d=json.load(open(".github/roots/micro-saas-credentials-v1.json")); s=json.load(open(".github/roots/factory-credential-requirements.schema.json")); jsonschema.Draft202012Validator(s).validate(d)'

          gh api --paginate 'user/repos?per_page=100&affiliation=owner' \
            | jq -r --arg owner "$OWNER" '.[] | select(.owner.login == $owner) | .full_name' > repos.txt

          gates=0
          while IFS= read -r repo; do
            [ "$repo" = "$GITHUB_REPOSITORY" ] && continue
            if ! gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${repo}/contents/.factory/profile.json" > /tmp/profile.json 2>/dev/null; then
              continue
            fi
            jq -e --arg repo "$repo" '.managed == true and .repository == $repo and .blueprint == "roots-micro-saas-v1"' /tmp/profile.json >/dev/null || continue

            gh label create 'factory:credentials-ready' --repo "$repo" --color 0E8A16 \
              --description 'Human attested that required external credentials are provisioned in approved secret stores' --force >/dev/null 2>&1 || true
            gh label create 'factory:human-required' --repo "$repo" --color D93F0B \
              --description 'Human authority is required for this transition' --force >/dev/null 2>&1 || true

            endpoint="repos/${repo}/contents/.factory/credential-requirements.json"
            if ! gh api -H 'Accept: application/vnd.github.raw+json' "$endpoint" > /tmp/target-manifest.json 2>/dev/null; then
              encoded="$(base64 -w0 "$MANIFEST")"
              gh api --method PUT "$endpoint" -f message='factory: install human-owned credential requirements' -f content="$encoded" >/dev/null
            else
              python3 -c 'import json,jsonschema; d=json.load(open("/tmp/target-manifest.json")); s=json.load(open(".github/roots/factory-credential-requirements.schema.json")); jsonschema.Draft202012Validator(s).validate(d)'
            fi

            phase=''
            if gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${repo}/contents/.factory/product-state.json" > /tmp/state.json 2>/dev/null; then
              phase="$(jq -r '.phase // ""' /tmp/state.json)"
            fi

            launch_context=false
            if [ "$phase" = 'LAUNCH_READY' ] || [ "$phase" = 'MEASURING' ] || [ "$phase" = 'ITERATING' ]; then
              launch_context=true
            fi
            if gh api --paginate "repos/${repo}/milestones?state=open&per_page=100" \
              | jq -e '.[] | select((.title | ascii_downcase) | contains("launch"))' >/dev/null; then
              launch_context=true
            fi
            [ "$launch_context" = 'false' ] && continue

            title='[FACTORY] Credential provisioning gate'
            gate_issue="$(gh issue list --repo "$repo" --state open --limit 50 --json number,title --jq '.[] | select(.title == "[FACTORY] Credential provisioning gate") | .number' | head -n 1)"
            if [ -z "$gate_issue" ]; then
              checklist="$(jq -r '.services[] | "- [ ] **" + .id + "**: provision credential names " + (.credential_names | join(", ")) + " in the approved provider/GitHub secret store."' "$MANIFEST")"
              body="$(printf '%s\n\n%s\n\n%s\n\n%s\n\n%s' \
                '<!-- roots-credential-gate:v1 -->' \
                'HUMAN_REQUIRED. Roots intentionally knows only required credential NAMES, never their values.' \
                "$checklist" \
                'When the required services for the intended environment are provisioned, a human may add the label factory:credentials-ready to this issue. That label is an attestation only; no workflow will print, inspect, export, create or rotate secret values.' \
                'Production deployment remains separately HUMAN_REQUIRED even after credential readiness is attested.')"
              gate_issue="$(gh issue create --repo "$repo" --title "$title" --label 'factory:human-required' --body "$body" --json number --jq '.number')"
            fi
            gates="$((gates + 1))"
            if gh api "repos/${repo}/issues/${gate_issue}" --jq '[.labels[].name] | index("factory:credentials-ready") != null' | grep -q true; then
              echo "CREDENTIAL_READINESS_ATTESTED: ${repo}#${gate_issue}. Values remain unread."
            else
              echo "HUMAN_REQUIRED: ${repo}#${gate_issue} awaits credential readiness attestation."
            fi
          done < repos.txt

          echo "Credential readiness gates observed: ${gates}."

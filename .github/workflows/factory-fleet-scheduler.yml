name: factory-fleet-scheduler-v2

"on":
  workflow_dispatch:
    inputs:
      execute:
        description: 'Dispatch one eligible issue across the managed fleet'
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: factory-fleet-scheduler
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLEET_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
      CONTROL_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      EXECUTE: ${{ github.event_name == 'schedule' || inputs.execute }}
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Quality REWORK reconciliation
        shell: bash
        run: |
          set -euo pipefail
          GH_TOKEN="$CONTROL_TOKEN" gh workflow run factory-fleet-jules-quality-rework.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref Android

      - name: Trigger and verify managed auto-merge reconciliation
        shell: bash
        run: |
          set -euo pipefail
          before="$(GH_TOKEN="$CONTROL_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/factory-managed-automerge.yml/runs?event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0].id // 0')"
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          GH_TOKEN="$CONTROL_TOKEN" gh workflow run factory-managed-automerge.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref Android \
            -f execute=true

          run_id=''
          for _ in $(seq 1 12); do
            # shellcheck disable=SC2016
            run_id="$(GH_TOKEN="$CONTROL_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/factory-managed-automerge.yml/runs?event=workflow_dispatch&per_page=10" \
              --jq --arg before "$before" --arg dispatched_at "$dispatched_at" '[.workflow_runs[] | select((.id|tostring) != $before and .created_at >= $dispatched_at)] | sort_by(.created_at) | last | .id // empty')"
            [ -n "$run_id" ] && break
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "AUTO_MERGE_DISPATCH_FAILED: no workflow_dispatch run materialized after successful dispatch request." >&2
            exit 1
          fi

          echo "AUTO_MERGE_DISPATCHED: run_id=${run_id}"
          echo "### Managed auto-merge dispatch" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dispatch request accepted at: ${dispatched_at}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Materialized workflow run: ${run_id}" >> "$GITHUB_STEP_SUMMARY"

      - name: Discover oldest eligible issue and reconcile dispatch acknowledgements
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLEET_TOKEN"
          echo "::add-mask::$FLEET_TOKEN"
          export GH_TOKEN="$FLEET_TOKEN"
          authenticated_login="$(gh api user --jq '.login')"
          test "$authenticated_login" = "$OWNER"
          gh api --paginate 'user/repos?per_page=100&affiliation=owner' \
            | jq -r --arg owner "$OWNER" '.[] | select(.owner.login == $owner) | .full_name' > repos.txt
          : > candidates.tsv
          : > managed-repos.txt

          while IFS= read -r repo; do
            [ "$repo" = "$GITHUB_REPOSITORY" ] && continue
            if ! gh api -H 'Accept: application/vnd.github.raw+json' "repos/${repo}/contents/.factory/profile.json" > /tmp/profile.json 2>/dev/null; then
              continue
            fi
            jq -e --arg repo "$repo" '.managed == true and .repository == $repo and .blueprint == "roots-micro-saas-v1"' /tmp/profile.json >/dev/null || continue
            echo "$repo" >> managed-repos.txt

            while IFS= read -r issue; do
              comments="$(gh api --paginate "repos/${repo}/issues/${issue}/comments")"
              if jq -e --arg prefix "<!-- roots-jules-session task_id=${repo}#${issue} " '.[] | select((.body // "") | contains($prefix))' <<< "$comments" >/dev/null; then
                if [ "$EXECUTE" = 'true' ]; then
                  gh issue edit "$issue" --repo "$repo" --remove-label 'factory:dispatching' --add-label 'factory:dispatched' >/dev/null
                fi
                echo "DISPATCH_ACK_RECOVERED: ${repo}#${issue}"
                continue
              fi

              requested_at="$(jq -r '[.[] | select((.body // "") | contains("<!-- roots-dispatch-request issue='"${issue}"' "))] | last | .created_at // empty' <<< "$comments")"
              [ -z "$requested_at" ] && continue
              stale="$(python3 -c 'from datetime import datetime, timezone; import sys; stamp=datetime.fromisoformat(sys.argv[1].replace("Z","+00:00")); print("true" if (datetime.now(timezone.utc)-stamp).total_seconds() > 1200 else "false")' "$requested_at")"
              if [ "$stale" = 'true' ] && [ "$EXECUTE" = 'true' ]; then
                gh issue edit "$issue" --repo "$repo" --remove-label 'factory:dispatching' --add-label 'factory:queued' >/dev/null
                gh api --method POST "repos/${repo}/issues/${issue}/comments" \
                  -f body="<!-- roots-dispatch-recovered issue=${issue} -->\nDispatch acknowledgement timed out after 20 minutes with no persisted Jules session; returned safely to factory:queued." >/dev/null
                echo "DISPATCH_TIMEOUT_RECOVERED: ${repo}#${issue}"
              fi
            done < <(gh issue list --repo "$repo" --state open --label 'factory:dispatching' --limit 100 --json number --jq '.[].number')
          done < repos.txt

          active=0
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            dispatching="$(gh issue list --repo "$repo" --state open --label 'factory:dispatching' --limit 1 --json number --jq 'length')"
            dispatched="$(gh issue list --repo "$repo" --state open --label 'factory:dispatched' --limit 1 --json number --jq 'length')"
            escalated="$(gh issue list --repo "$repo" --state open --label 'factory:escalated' --limit 1 --json number --jq 'length')"
            if [ "$dispatching" -gt 0 ] || [ "$dispatched" -gt 0 ] || [ "$escalated" -gt 0 ]; then
              active=1
              echo "GLOBAL_WORKER_LOCK: active or escalated task identity exists in ${repo}; no new dispatch this run."
              break
            fi
          done < managed-repos.txt

          if [ "$active" -eq 1 ]; then
            echo 'repository=' >> "$GITHUB_OUTPUT"
            echo 'issue_number=' >> "$GITHUB_OUTPUT"
            echo 'global_lock=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/${repo}/contents/.factory/profile.json" > /tmp/profile.json
            gh issue list --repo "$repo" --state open --label 'factory:queued' --limit 100 --json number,body,createdAt \
              | jq -c '.[]' | while IFS= read -r row; do
              issue="$(jq -r '.number' <<< "$row")"
              body="$(jq -r '.body // ""' <<< "$row")"
              created="$(jq -r '.createdAt' <<< "$row")"
              gh pr list --repo "$repo" --state open --search "#${issue}" --json body,baseRefName > /tmp/prs.json
              branch="$(jq -r '.default_branch' /tmp/profile.json)"
              linked="$(jq --argjson issue "$issue" --arg branch "$branch" '[.[] | select(.baseRefName == $branch) | select((.body // "") | test("(?i)(fixes|closes|resolves|refs|references)\\s+#" + ($issue|tostring) + "\\b"))] | length' /tmp/prs.json)"
              [ "$linked" -gt 0 ] && continue

              blocked=false
              blockers="$(printf '%s\n' "$body" | grep -Eio 'Blocked-By:[[:space:]]*#[0-9]+' | grep -Eo '[0-9]+' || true)"
              while IFS= read -r blocker; do
                [ -z "$blocker" ] && continue
                state="$(gh api "repos/${repo}/issues/${blocker}" --jq '.state')"
                if [ "$state" != 'closed' ]; then
                  blocked=true
                  break
                fi
              done <<< "$blockers"
              [ "$blocked" = 'true' ] && continue
              printf '%s\t%s\t%s\n' "$created" "$repo" "$issue" >> candidates.tsv
            done
          done < managed-repos.txt

          echo 'global_lock=false' >> "$GITHUB_OUTPUT"
          if [ ! -s candidates.tsv ]; then
            echo 'repository=' >> "$GITHUB_OUTPUT"
            echo 'issue_number=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sort candidates.tsv | head -n 1 > selected.tsv
          echo "repository=$(cut -f2 selected.tsv)" >> "$GITHUB_OUTPUT"
          echo "issue_number=$(cut -f3 selected.tsv)" >> "$GITHUB_OUTPUT"

      - name: Enter acknowledged dispatching state and trigger dispatcher
        if: steps.candidate.outputs.repository != '' && env.EXECUTE == 'true'
        shell: bash
        env:
          TARGET_REPO: ${{ steps.candidate.outputs.repository }}
          ISSUE_NUMBER: ${{ steps.candidate.outputs.issue_number }}
        run: |
          set -euo pipefail
          marker="<!-- roots-dispatch-request issue=${ISSUE_NUMBER} run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} -->"
          GH_TOKEN="$FLEET_TOKEN" gh issue edit "$ISSUE_NUMBER" --repo "$TARGET_REPO" \
            --remove-label 'factory:queued' --add-label 'factory:dispatching'
          GH_TOKEN="$FLEET_TOKEN" gh api --method POST "repos/${TARGET_REPO}/issues/${ISSUE_NUMBER}/comments" \
            -f body="${marker}\nDispatch requested by central scheduler. State remains factory:dispatching until a worker-session marker is persisted."

          if ! GH_TOKEN="$CONTROL_TOKEN" gh workflow run factory-cross-repo-dispatch.yml \
            --repo "$GITHUB_REPOSITORY" --ref Android \
            -f repository="$TARGET_REPO" -f issue_number="$ISSUE_NUMBER" -f execute=true; then
            GH_TOKEN="$FLEET_TOKEN" gh issue edit "$ISSUE_NUMBER" --repo "$TARGET_REPO" \
              --remove-label 'factory:dispatching' --add-label 'factory:queued' || true
            exit 1
          fi

      - name: Summary
        shell: bash
        env:
          TARGET_REPO: ${{ steps.candidate.outputs.repository }}
          ISSUE_NUMBER: ${{ steps.candidate.outputs.issue_number }}
          GLOBAL_LOCK: ${{ steps.candidate.outputs.global_lock }}
        run: |
          {
            echo '### Fleet scheduler v2'
            echo "- Candidate repository: ${TARGET_REPO:-none}"
            echo "- Candidate issue: ${ISSUE_NUMBER:-none}"
            echo "- Global worker lock: ${GLOBAL_LOCK:-false}"
            echo "- Execute: ${EXECUTE}"
            echo '- Sequential invariant: at most one open dispatching/dispatched/escalated task identity across the managed fleet.'
            echo '- Dispatch invariant: queued -> dispatching -> persisted Jules session -> dispatched.'
            echo '- Exhausted workers transition to escalated + human-required and continue holding the lock fail-closed.'
            echo '- Missing acknowledgement after 20 minutes is reconciled back to queued.'
          } >> "$GITHUB_STEP_SUMMARY"

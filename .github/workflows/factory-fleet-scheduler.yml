name: factory-fleet-scheduler-v1

"on":
  workflow_dispatch:
    inputs:
      execute:
        description: 'Dispatch one eligible issue across the managed fleet'
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '11,41 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: factory-fleet-scheduler
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLEET_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
      CONTROL_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      EXECUTE: ${{ github.event_name == 'schedule' || inputs.execute }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover oldest eligible issue across managed repositories
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLEET_TOKEN"
          echo "::add-mask::$FLEET_TOKEN"
          export GH_TOKEN="$FLEET_TOKEN"
          authenticated_login="$(gh api user --jq '.login')"
          test "$authenticated_login" = "$OWNER"
          gh api --paginate 'user/repos?per_page=100&affiliation=owner' --jq --arg owner "$OWNER" '.[] | select(.owner.login == $owner) | .full_name' > repos.txt
          : > candidates.tsv
          while IFS= read -r repo; do
            [ "$repo" = "$GITHUB_REPOSITORY" ] && continue
            profile_b64="$(gh api "repos/${repo}/contents/.factory/profile.json" --jq '.content' 2>/dev/null || true)"
            [ -z "$profile_b64" ] && continue
            printf '%s' "$profile_b64" | tr -d '\n' | base64 -d > /tmp/profile.json
            jq -e --arg repo "$repo" '.managed == true and .repository == $repo and .blueprint == "roots-micro-saas-v1"' /tmp/profile.json >/dev/null || continue

            gh issue list --repo "$repo" --state open --label 'factory:queued' --limit 100 --json number,body,createdAt | jq -c '.[]' | while IFS= read -r row; do
              issue="$(jq -r '.number' <<< "$row")"
              body="$(jq -r '.body // ""' <<< "$row")"
              created="$(jq -r '.createdAt' <<< "$row")"
              gh pr list --repo "$repo" --state open --search "#${issue}" --json body,baseRefName > /tmp/prs.json
              branch="$(jq -r '.default_branch' /tmp/profile.json)"
              linked="$(jq --argjson issue "$issue" --arg branch "$branch" '[.[] | select(.baseRefName == $branch) | select((.body // "") | test("(?i)(fixes|closes|resolves|refs|references)\\s+#" + ($issue|tostring) + "\\b"))] | length' /tmp/prs.json)"
              [ "$linked" -gt 0 ] && continue

              blocked=false
              blockers="$(printf '%s\n' "$body" | grep -Eio 'Blocked-By:[[:space:]]*#[0-9]+' | grep -Eo '[0-9]+' || true)"
              while IFS= read -r blocker; do
                [ -z "$blocker" ] && continue
                state="$(gh api "repos/${repo}/issues/${blocker}" --jq '.state')"
                if [ "$state" != 'closed' ]; then
                  blocked=true
                  break
                fi
              done <<< "$blockers"
              [ "$blocked" = 'true' ] && continue
              printf '%s\t%s\t%s\n' "$created" "$repo" "$issue" >> candidates.tsv
            done
          done < repos.txt

          if [ ! -s candidates.tsv ]; then
            echo 'repository=' >> "$GITHUB_OUTPUT"
            echo 'issue_number=' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sort candidates.tsv | head -n 1 > selected.tsv
          repo="$(cut -f2 selected.tsv)"
          issue="$(cut -f3 selected.tsv)"
          echo "repository=$repo" >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue" >> "$GITHUB_OUTPUT"

      - name: Dispatch through central cross-repo dispatcher
        if: steps.candidate.outputs.repository != '' && env.EXECUTE == 'true'
        shell: bash
        env:
          TARGET_REPO: ${{ steps.candidate.outputs.repository }}
          ISSUE_NUMBER: ${{ steps.candidate.outputs.issue_number }}
        run: |
          set -euo pipefail
          GH_TOKEN="$CONTROL_TOKEN" gh workflow run factory-cross-repo-dispatch.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref Android \
            -f repository="$TARGET_REPO" \
            -f issue_number="$ISSUE_NUMBER" \
            -f execute=true
          GH_TOKEN="$FLEET_TOKEN" gh issue edit "$ISSUE_NUMBER" --repo "$TARGET_REPO" --remove-label 'factory:queued' --add-label 'factory:dispatched'

      - name: Summary
        shell: bash
        env:
          TARGET_REPO: ${{ steps.candidate.outputs.repository }}
          ISSUE_NUMBER: ${{ steps.candidate.outputs.issue_number }}
        run: |
          {
            echo '### Fleet scheduler'
            echo "- Owner: ${OWNER}"
            echo "- Candidate repository: ${TARGET_REPO:-none}"
            echo "- Candidate issue: ${ISSUE_NUMBER:-none}"
            echo "- Execute: ${EXECUTE}"
            echo '- Policy: oldest eligible issue fleet-wide, dependencies closed, no active linked PR.'
          } >> "$GITHUB_STEP_SUMMARY"

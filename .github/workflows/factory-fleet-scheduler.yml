name: factory-fleet-scheduler-v4

"on":
  workflow_dispatch:
    inputs:
      execute:
        description: 'Dispatch Jules-eligible issues up to available worker capacity'
        required: true
        default: false
        type: boolean
      dispatch_only:
        description: 'Event handoff: select eligible work without restarting reconciliation'
        required: true
        default: false
        type: boolean
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: factory-fleet-scheduler
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLEET_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
      CONTROL_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      EXECUTE: ${{ github.event_name == 'schedule' || inputs.execute }}
      CAPACITY_FILE: .github/roots/factory-worker-capacity.json
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Quality REWORK reconciliation
        if: inputs.dispatch_only != true && env.EXECUTE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          GH_TOKEN="$CONTROL_TOKEN" gh workflow run factory-fleet-jules-quality-rework.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref Android

      - name: Trigger Quality Risk reconciliation before managed auto-merge
        if: inputs.dispatch_only != true && env.EXECUTE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          GH_TOKEN="$CONTROL_TOKEN" gh workflow run factory-quality-risk-reconciler.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref Android
          echo 'QUALITY_RISK_DISPATCHED: reconciliation owns the handoff to auto-merge.'

      - name: Discover Jules-eligible issues and available slots
        id: candidates
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLEET_TOKEN"
          test -f "$CAPACITY_FILE"
          echo "::add-mask::$FLEET_TOKEN"
          export GH_TOKEN="$FLEET_TOKEN"
          authenticated_login="$(gh api user --jq '.login')"
          test "$authenticated_login" = "$OWNER"

          max_concurrency="$(jq -r '.workers.jules.max_concurrency' "$CAPACITY_FILE")"
          chatgpt_label="$(jq -r '.workers.chatgpt.selection_label' "$CAPACITY_FILE")"
          if ! [[ "$max_concurrency" =~ ^[0-9]+$ ]] || [ "$max_concurrency" -lt 1 ] || [ "$max_concurrency" -gt 15 ]; then
            echo "CONTROL_PLANE_ANOMALY: invalid Jules max_concurrency=${max_concurrency}; expected 1..15." >&2
            exit 1
          fi
          [ "$chatgpt_label" = 'factory:agent:chatgpt' ] || {
            echo "CONTROL_PLANE_ANOMALY: unexpected ChatGPT selection label '${chatgpt_label}'." >&2
            exit 1
          }

          gh api --paginate 'user/repos?per_page=100&affiliation=owner' \
            | jq -r --arg owner "$OWNER" '.[] | select(.owner.login == $owner) | .full_name' > repos.txt
          : > candidates.tsv
          : > managed-repos.txt

          while IFS= read -r repo; do
            [ "$repo" = "$GITHUB_REPOSITORY" ] && continue
            if ! gh api -H 'Accept: application/vnd.github.raw+json' "repos/${repo}/contents/.factory/profile.json" > /tmp/profile.json 2>/dev/null; then
              continue
            fi
            jq -e --arg repo "$repo" '.managed == true and .repository == $repo and .blueprint == "roots-micro-saas-v1" and (.worker_policy.enabled | index("jules") != null)' /tmp/profile.json >/dev/null || continue
            echo "$repo" >> managed-repos.txt

            while IFS= read -r issue; do
              [ -z "$issue" ] && continue
              comments="$(gh api --paginate "repos/${repo}/issues/${issue}/comments")"
              if jq -e --arg prefix "<!-- roots-jules-session task_id=${repo}#${issue} " '.[] | select((.body // "") | contains($prefix))' <<< "$comments" >/dev/null; then
                if [ "$EXECUTE" = 'true' ]; then
                  gh issue edit "$issue" --repo "$repo" --remove-label 'factory:dispatching' --add-label 'factory:dispatched' >/dev/null
                fi
                echo "DISPATCH_ACK_RECOVERED: ${repo}#${issue}"
                continue
              fi

              requested_at="$(jq -r '[.[] | select((.body // "") | contains("<!-- roots-dispatch-request issue='"${issue}"' "))] | last | .created_at // empty' <<< "$comments")"
              [ -z "$requested_at" ] && continue
              stale="$(python3 -c 'from datetime import datetime, timezone; import sys; stamp=datetime.fromisoformat(sys.argv[1].replace("Z","+00:00")); print("true" if (datetime.now(timezone.utc)-stamp).total_seconds() > 1200 else "false")' "$requested_at")"
              if [ "$stale" = 'true' ] && [ "$EXECUTE" = 'true' ]; then
                gh issue edit "$issue" --repo "$repo" --remove-label 'factory:dispatching' --add-label 'factory:queued' >/dev/null
                gh api --method POST "repos/${repo}/issues/${issue}/comments" \
                  -f body="<!-- roots-dispatch-recovered issue=${issue} -->\nJules dispatch acknowledgement timed out after 20 minutes with no persisted Jules session; returned safely to factory:queued." >/dev/null
                echo "DISPATCH_TIMEOUT_RECOVERED: ${repo}#${issue}"
              fi
            done < <(gh issue list --repo "$repo" --state open --label 'factory:dispatching' --limit 100 --json number,labels \
              --jq '.[] | select(([.labels[].name] | index("factory:agent:chatgpt")) == null) | .number')
          done < repos.txt

          active_slots=0
          escalated_identities=0
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            dispatching="$(gh issue list --repo "$repo" --state open --label 'factory:dispatching' --limit 100 --json labels \
              --jq '[.[] | select(([.labels[].name] | index("factory:agent:chatgpt")) == null)] | length')"
            dispatched="$(gh issue list --repo "$repo" --state open --label 'factory:dispatched' --limit 100 --json labels \
              --jq '[.[] | select(([.labels[].name] | index("factory:agent:chatgpt")) == null)] | length')"
            escalated="$(gh issue list --repo "$repo" --state open --label 'factory:escalated' --limit 100 --json labels \
              --jq '[.[] | select(([.labels[].name] | index("factory:agent:chatgpt")) == null)] | length')"
            active_slots="$((active_slots + dispatching + dispatched))"
            escalated_identities="$((escalated_identities + escalated))"
          done < managed-repos.txt

          if [ "$active_slots" -gt "$max_concurrency" ]; then
            echo "CONTROL_PLANE_ANOMALY: Jules active slots ${active_slots} exceed configured capacity ${max_concurrency}; fail closed." >&2
            echo "capacity=${max_concurrency}" >> "$GITHUB_OUTPUT"
            echo "active_slots=${active_slots}" >> "$GITHUB_OUTPUT"
            echo 'available_slots=0' >> "$GITHUB_OUTPUT"
            echo 'selected_count=0' >> "$GITHUB_OUTPUT"
            echo "escalated_identities=${escalated_identities}" >> "$GITHUB_OUTPUT"
            echo 'capacity_violation=true' >> "$GITHUB_OUTPUT"
            : > selected.tsv
            exit 0
          fi

          available_slots="$((max_concurrency - active_slots))"

          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/${repo}/contents/.factory/profile.json" > /tmp/profile.json
            gh issue list --repo "$repo" --state open --label 'factory:queued' --limit 100 --json number,body,createdAt,labels \
              | jq -c '.[] | select(([.labels[].name] | index("factory:agent:chatgpt")) == null)' | while IFS= read -r row; do
              issue="$(jq -r '.number' <<< "$row")"
              body="$(jq -r '.body // ""' <<< "$row")"
              created="$(jq -r '.createdAt' <<< "$row")"
              branch="$(jq -r '.default_branch' /tmp/profile.json)"

              gh pr list --repo "$repo" --state open --search "#${issue}" --json body,baseRefName > /tmp/prs.json
              linked="$(jq --argjson issue "$issue" --arg branch "$branch" '[.[] | select(.baseRefName == $branch) | select((.body // "") | test("(?i)(fixes|closes|resolves|refs|references)\\s+#" + ($issue|tostring) + "\\b"))] | length' /tmp/prs.json)"
              [ "$linked" -gt 0 ] && continue

              blocked=false
              blockers="$(printf '%s\n' "$body" | grep -Eio 'Blocked-By:[[:space:]]*#[0-9]+' | grep -Eo '[0-9]+' || true)"
              while IFS= read -r blocker; do
                [ -z "$blocker" ] && continue
                state="$(gh api "repos/${repo}/issues/${blocker}" --jq '.state')"
                if [ "$state" != 'closed' ]; then
                  blocked=true
                  break
                fi
              done <<< "$blockers"
              [ "$blocked" = 'true' ] && continue
              printf '%s\t%s\t%s\n' "$created" "$repo" "$issue" >> candidates.tsv
            done
          done < managed-repos.txt

          : > selected.tsv
          if [ "$available_slots" -gt 0 ] && [ -s candidates.tsv ]; then
            sort candidates.tsv | head -n "$available_slots" > selected.tsv
          fi
          selected_count="$(wc -l < selected.tsv | tr -d ' ')"

          echo "capacity=${max_concurrency}" >> "$GITHUB_OUTPUT"
          echo "active_slots=${active_slots}" >> "$GITHUB_OUTPUT"
          echo "available_slots=${available_slots}" >> "$GITHUB_OUTPUT"
          echo "selected_count=${selected_count}" >> "$GITHUB_OUTPUT"
          echo "escalated_identities=${escalated_identities}" >> "$GITHUB_OUTPUT"
          echo 'capacity_violation=false' >> "$GITHUB_OUTPUT"

      - name: Reserve selected identities and dispatch Jules pool
        if: steps.candidates.outputs.selected_count != '' && steps.candidates.outputs.selected_count != '0' && env.EXECUTE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          : > reserved.tsv
          slot=0

          while IFS=$'\t' read -r created repo issue; do
            [ -z "$repo" ] && continue
            : "$created"
            labels="$(GH_TOKEN="$FLEET_TOKEN" gh api "repos/${repo}/issues/${issue}" --jq '[.labels[].name]')"
            if ! jq -e 'index("factory:queued") != null and index("factory:dispatching") == null and index("factory:dispatched") == null and index("factory:escalated") == null and index("factory:agent:chatgpt") == null' <<< "$labels" >/dev/null; then
              echo "DISPATCH_SKIPPED: ${repo}#${issue} changed state or worker route after candidate selection."
              continue
            fi
            slot="$((slot + 1))"
            marker="<!-- roots-dispatch-request issue=${issue} run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} slot=${slot} worker=jules -->"
            GH_TOKEN="$FLEET_TOKEN" gh issue edit "$issue" --repo "$repo" \
              --remove-label 'factory:queued' --add-label 'factory:dispatching'
            GH_TOKEN="$FLEET_TOKEN" gh api --method POST "repos/${repo}/issues/${issue}/comments" \
              -f body="${marker}\nDispatch requested by central scheduler for Jules. This task owns one bounded Jules slot until completion; state remains factory:dispatching until the session marker is persisted."
            printf '%s\t%s\n' "$repo" "$issue" >> reserved.tsv
          done < selected.tsv

          failures=0
          while IFS=$'\t' read -r repo issue; do
            [ -z "$repo" ] && continue
            if ! GH_TOKEN="$CONTROL_TOKEN" gh workflow run factory-cross-repo-dispatch.yml \
              --repo "$GITHUB_REPOSITORY" --ref Android \
              -f repository="$repo" -f issue_number="$issue" -f execute=true; then
              failures="$((failures + 1))"
              GH_TOKEN="$FLEET_TOKEN" gh issue edit "$issue" --repo "$repo" \
                --remove-label 'factory:dispatching' --add-label 'factory:queued' || true
              GH_TOKEN="$FLEET_TOKEN" gh api --method POST "repos/${repo}/issues/${issue}/comments" \
                -f body="<!-- roots-dispatch-launch-failed issue=${issue} run=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} worker=jules -->\nCross-repo Jules dispatch failed before a session was acknowledged; the task was returned to factory:queued." >/dev/null || true
              continue
            fi
            echo "JULES_SLOT_DISPATCHED: ${repo}#${issue}"
          done < reserved.tsv

          if [ "$failures" -gt 0 ]; then
            echo "${failures} Jules dispatch request(s) failed and were returned to queue." >&2
            exit 1
          fi

      - name: Summary
        shell: bash
        env:
          CAPACITY: ${{ steps.candidates.outputs.capacity }}
          ACTIVE_SLOTS: ${{ steps.candidates.outputs.active_slots }}
          AVAILABLE_SLOTS: ${{ steps.candidates.outputs.available_slots }}
          SELECTED_COUNT: ${{ steps.candidates.outputs.selected_count }}
          ESCALATED_IDENTITIES: ${{ steps.candidates.outputs.escalated_identities }}
          CAPACITY_VIOLATION: ${{ steps.candidates.outputs.capacity_violation }}
          DISPATCH_ONLY: ${{ inputs.dispatch_only }}
        run: |
          {
            echo '### Fleet scheduler v4 — routed Jules pool'
            echo "- Jules capacity: ${CAPACITY:-unknown}"
            echo "- Active Jules slots before dispatch: ${ACTIVE_SLOTS:-unknown}"
            echo "- Available Jules slots before dispatch: ${AVAILABLE_SLOTS:-unknown}"
            echo "- Selected Jules-eligible tasks: ${SELECTED_COUNT:-0}"
            echo "- Escalated Jules identities: ${ESCALATED_IDENTITIES:-0}"
            echo "- Capacity violation: ${CAPACITY_VIOLATION:-false}"
            echo "- Execute: ${EXECUTE}"
            echo "- Dispatch only: ${DISPATCH_ONLY:-false}"
            echo '- Jules scheduling requires worker_policy.enabled to contain jules.'
            echo '- factory:agent:chatgpt is an explicit worker route and is excluded from Jules selection, acknowledgement recovery and capacity.'
            echo '- Capacity invariant: Jules dispatching + dispatched identities <= configured Jules max_concurrency.'
            echo '- Identity invariant remains one issue -> one worker identity -> one branch -> one PR.'
            echo '- Cron is recovery/fallback; event-driven dispatch_only remains the nominal queue handoff.'
          } >> "$GITHUB_STEP_SUMMARY"

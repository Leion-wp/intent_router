name: factory-stalled-reconciler-v1

"on":
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: factory-stalled-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLEET_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Reconcile stale factory:stalled labels
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLEET_TOKEN"
          echo "::add-mask::$FLEET_TOKEN"
          export GH_TOKEN="$FLEET_TOKEN"
          test "$(gh api user --jq '.login')" = "$OWNER"

          gh api --paginate 'user/repos?per_page=100&affiliation=owner' \
            | jq -r --arg owner "$OWNER" '.[] | select(.owner.login == $owner) | .full_name' > repos.txt

          reconciled=0
          inspected=0

          while IFS= read -r repo; do
            [ "$repo" = "$GITHUB_REPOSITORY" ] && continue

            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${repo}/contents/.factory/profile.json" > /tmp/profile.json 2>/dev/null || continue
            jq -e --arg repo "$repo" \
              '.managed == true and .repository == $repo and .blueprint == "roots-micro-saas-v1"' \
              /tmp/profile.json >/dev/null || continue

            branch="$(jq -r '.default_branch' /tmp/profile.json)"

            gh issue list --repo "$repo" --state open --label 'factory:stalled' \
              --limit 100 --json number > /tmp/stalled.json

            while IFS= read -r issue; do
              [ -z "$issue" ] && continue
              inspected="$((inspected + 1))"

              comments="$(gh api --paginate "repos/${repo}/issues/${issue}/comments")"
              printf '%s' "$comments" > /tmp/stalled-comments.json
              identity_json=''
              identity_rc=0
              set +e
              identity_json="$(PYTHONPATH=.github/roots python3 - "$repo" "$issue" /tmp/stalled-comments.json <<'PY'
          import json
          import sys
          from pathlib import Path

          from factory_worker_identity import IdentityConflict, IdentityNoMatch, issue_identity

          repo = sys.argv[1]
          issue = int(sys.argv[2])
          comments = json.loads(Path(sys.argv[3]).read_text())
          try:
              identity = issue_identity(repo, issue, comments)
          except IdentityNoMatch:
              raise SystemExit(2)
          except IdentityConflict as exc:
              print(f"IDENTITY_CONFLICT: {exc}", file=sys.stderr)
              raise SystemExit(3)
          print(json.dumps(identity, sort_keys=True))
          PY
              )"
              identity_rc=$?
              set -e

              if [ "$identity_rc" -eq 3 ]; then
                echo "CONTROL_PLANE_ANOMALY: ${repo}#${issue} has conflicting or malformed persisted worker identity; leaving factory:stalled fail-closed." >&2
                continue
              fi
              if [ "$identity_rc" -ne 0 ] && [ "$identity_rc" -ne 2 ]; then
                echo "CONTROL_PLANE_ANOMALY: ${repo}#${issue} canonical worker identity resolver failed with rc=${identity_rc}; leaving factory:stalled fail-closed." >&2
                continue
              fi

              session_id=''
              if [ "$identity_rc" -eq 0 ] && [ "$(jq -r '.provider // ""' <<< "$identity_json")" = 'jules' ]; then
                session="$(jq -r '.session // ""' <<< "$identity_json")"
                [ -n "$session" ] && session_id="${session##*/}"
              fi

              gh pr list --repo "$repo" --state open --limit 100 \
                --json number,body,headRefName,baseRefName,url > /tmp/open-prs.json

              jq --argjson issue "$issue" --arg branch "$branch" \
                '[.[] | select(.baseRefName == $branch) | select((.body // "") | test("(?i)(fixes|closes|resolves|refs|references)\\s+#" + ($issue|tostring) + "\\b"))]' \
                /tmp/open-prs.json > /tmp/linked-open.json

              count="$(jq 'length' /tmp/linked-open.json)"

              if [ "$count" -eq 0 ] && [ -n "$session_id" ]; then
                jq --arg branch "$branch" --arg session_id "$session_id" \
                  '[.[] | select(.baseRefName == $branch) | select((.headRefName // "") | contains($session_id))]' \
                  /tmp/open-prs.json > /tmp/linked-open.json
                count="$(jq 'length' /tmp/linked-open.json)"
              fi

              if [ "$count" -eq 0 ]; then
                echo "STILL_STALLED: ${repo}#${issue} has no correlated open PR."
                continue
              fi

              if [ "$count" -gt 1 ]; then
                echo "CONTROL_PLANE_ANOMALY: ${repo}#${issue} has ${count} correlated open PRs; leaving factory:stalled fail-closed." >&2
                continue
              fi

              pr="$(jq -r '.[0].number' /tmp/linked-open.json)"
              pr_url="$(jq -r '.[0].url' /tmp/linked-open.json)"

              gh issue edit "$issue" --repo "$repo" --remove-label 'factory:stalled' >/dev/null
              reconciled="$((reconciled + 1))"
              echo "RECOVERED: ${repo}#${issue} has active PR #${pr}; removed factory:stalled. ${pr_url}"
            done < <(jq -r '.[].number' /tmp/stalled.json)
          done < repos.txt

          echo "inspected=$inspected" >> "$GITHUB_OUTPUT"
          echo "reconciled=$reconciled" >> "$GITHUB_OUTPUT"

      - name: Reconcile Quality risk immediately after stalled recovery
        if: steps.reconcile.outputs.reconciled != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run factory-quality-risk-reconciler.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref Android
          echo 'STALLED_RECOVERY_HANDOFF: Quality Risk reconciler dispatched.'

      - name: Summary
        shell: bash
        env:
          INSPECTED: ${{ steps.reconcile.outputs.inspected }}
          RECONCILED: ${{ steps.reconcile.outputs.reconciled }}
        run: |
          {
            echo '### Fleet stalled reconciler'
            echo "- Stalled tasks inspected: ${INSPECTED:-0}"
            echo "- Stalled labels removed: ${RECONCILED:-0}"
            echo '- Invariant: factory:stalled represents current lack of worker progress, not historical state.'
            echo '- Rule: stalled + exactly one correlated open PR -> remove factory:stalled.'
            echo '- Otherwise: leave factory:stalled unchanged.'
            echo '- Correlation: explicit issue reference first, canonical persisted Jules session ID in PR branch as fallback.'
            echo '- Malformed or conflicting canonical worker identity is fail-closed.'
            echo '- Multiple correlated open PRs are treated as a control-plane anomaly and remain fail-closed.'
            echo '- Successful recovery hands off immediately to Quality Risk; cron remains recovery-only.'
          } >> "$GITHUB_STEP_SUMMARY"

name: factory-low-risk-auto-merge-v1

"on":
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: factory-low-risk-auto-merge-v1
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
      CONTROL_REPO: ${{ github.repository }}
    steps:
      - name: Validate authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'Android' || test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test -n "$GH_TOKEN"
          echo "::add-mask::$GH_TOKEN"

      - name: Read managed repository inventory from Portfolio telemetry
        shell: bash
        run: |
          set -euo pipefail
          telemetry_number="$(gh issue list --repo "$CONTROL_REPO" --state open --search 'in:title "[FACTORY] Portfolio telemetry"' --json number,title --jq '.[] | select(.title == "[FACTORY] Portfolio telemetry") | .number' | head -n1)"
          test -n "$telemetry_number"
          gh api "repos/${CONTROL_REPO}/issues/${telemetry_number}" --jq '.body' > telemetry-body.txt
          awk '/^```json$/ {inside=1; next} /^```$/ && inside {exit} inside {print}' telemetry-body.txt > telemetry.json
          jq -e '.version == 1 and (.repositories | type == "array")' telemetry.json >/dev/null
          jq -r '.repositories[].repository' telemetry.json | sort -u > managed-repos.txt
          test -s managed-repos.txt

      - name: Evaluate LOW_RISK PRs and merge only proven-safe heads
        shell: bash
        run: |
          set -euo pipefail
          merged=0
          while IFS= read -r repo; do
            [[ "$repo" =~ ^Leion-wp/[A-Za-z0-9._-]+$ ]] || { echo "skip invalid repo: $repo"; continue; }

            gh api "repos/${repo}/contents/.factory/profile.json" --jq '.content' | tr -d '\n' | base64 -d > profile.json
            jq -e --arg repo "$repo" '.version == 1 and .managed == true and .repository == $repo' profile.json >/dev/null
            base="$(jq -r '.default_branch' profile.json)"

            gh pr list --repo "$repo" --state open --limit 100 --json number,headRefOid,baseRefName,isDraft,mergeStateStatus,reviewDecision,labels > prs.json
            while IFS= read -r pr; do
              number="$(jq -r '.number' <<<"$pr")"
              head="$(jq -r '.headRefOid' <<<"$pr")"
              pr_base="$(jq -r '.baseRefName' <<<"$pr")"
              draft="$(jq -r '.isDraft' <<<"$pr")"
              merge_state="$(jq -r '.mergeStateStatus // "UNKNOWN"' <<<"$pr")"
              review="$(jq -r '.reviewDecision // ""' <<<"$pr")"

              low_risk="$(jq '[.labels[].name] | index("factory:risk-low") != null' <<<"$pr")"
              [ "$low_risk" = true ] || continue
              [ "$draft" = false ] || continue
              [ "$pr_base" = "$base" ] || continue
              [ "$review" != 'CHANGES_REQUESTED' ] || continue
              case "$merge_state" in BLOCKED|DIRTY|UNKNOWN) continue ;; esac

              issue_json="$(gh api "repos/${repo}/issues/${number}")"
              labels="$(jq -r '[.labels[].name] | join("\n")' <<<"$issue_json")"
              if grep -Eq '^factory:(human-required|blocked|escalated)$' <<<"$labels"; then
                continue
              fi

              gh api --paginate "repos/${repo}/pulls/${number}/files?per_page=100" --jq '.[].filename' > changed-paths.txt
              if grep -Eq '(^|/)(\.github/workflows/|\.factory/|CODEOWNERS$)|(^|/)(supabase/migrations/|infra/|terraform/|deploy/)|(^|/)(package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$' changed-paths.txt; then
                echo "${repo}#${number}: protected/high-risk path touched; human merge required"
                continue
              fi

              required_jobs="$(jq -r '.ci.required_jobs[]?' profile.json)"
              test -n "$required_jobs" || { echo "${repo}#${number}: no required_jobs declared; fail closed"; continue; }

              gh api "repos/${repo}/commits/${head}/check-runs?per_page=100" > checks.json
              checks_ok=true
              while IFS= read -r job; do
                count="$(jq --arg job "$job" '[.check_runs[] | select(.name == $job and .status == "completed" and .conclusion == "success")] | length' checks.json)"
                [ "$count" -ge 1 ] || checks_ok=false
              done <<<"$required_jobs"
              [ "$checks_ok" = true ] || { echo "${repo}#${number}: required CI not successful on ${head}"; continue; }

              # Race guard: re-read the PR immediately before merge and require the exact validated head.
              current="$(gh api "repos/${repo}/pulls/${number}")"
              current_head="$(jq -r '.head.sha' <<<"$current")"
              current_base="$(jq -r '.base.ref' <<<"$current")"
              current_state="$(jq -r '.state' <<<"$current")"
              current_draft="$(jq -r '.draft' <<<"$current")"
              [ "$current_head" = "$head" ] || { echo "${repo}#${number}: head moved; revalidation required"; continue; }
              [ "$current_base" = "$base" ] || continue
              [ "$current_state" = open ] || continue
              [ "$current_draft" = false ] || continue

              # Re-read labels so LOW_RISK cannot be withdrawn between validation and merge.
              current_issue="$(gh api "repos/${repo}/issues/${number}")"
              jq -e '[.labels[].name] | index("factory:risk-low") != null' <<<"$current_issue" >/dev/null || continue
              jq -e '[.labels[].name] | all(. != "factory:human-required" and . != "factory:blocked" and . != "factory:escalated")' <<<"$current_issue" >/dev/null || continue

              echo "${repo}#${number}: LOW_RISK gates satisfied for ${head}; merging"
              gh api --method PUT "repos/${repo}/pulls/${number}/merge" -f merge_method=squash -f sha="$head" >/tmp/merge.json
              jq -e '.merged == true' /tmp/merge.json >/dev/null
              merged=$((merged + 1))
            done < <(jq -c '.[]' prs.json)
          done < managed-repos.txt

          echo "Merged LOW_RISK PRs: $merged" >> "$GITHUB_STEP_SUMMARY"
